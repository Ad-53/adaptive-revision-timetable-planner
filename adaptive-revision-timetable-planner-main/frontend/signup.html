<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up - Adaptive Revision</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body data-theme="light">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Create Account</h1>
            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label for="displayName" class="form-label">Display Name</label>
                    <input type="text" id="displayName" class="form-input" required placeholder="Your name" />
                </div>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" required placeholder="you@example.com" />
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" required minlength="6" placeholder="At least 6 characters" />
                </div>
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" required minlength="6" placeholder="Re-enter password" />
                </div>
                <button type="submit" class="btn btn-primary btn-full-width">Create Account</button>
            </form>
            <div style="text-align: center; margin-top: 16px;">
                Already have an account? <a href="/login" style="font-size: 14px; color: var(--primary);">Sign in</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/requireAuth.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
