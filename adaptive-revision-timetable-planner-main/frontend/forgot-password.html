<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Forgot Password - Adaptive Revision</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body data-theme="light">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Reset Password</h1>
            <form id="forgot-form" class="auth-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-input" required placeholder="you@example.com" />
                </div>
                <button type="submit" class="btn btn-primary btn-full-width">Send Reset Link</button>
            </form>
            <div style="text-align: center; margin-top: 16px;">
                <a href="/login" style="font-size: 14px; color: var(--primary);">Back to login</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/requireAuth.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
