<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Adaptive Revision - RevisionAI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { text-align: center; color: white; padding: 40px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); }
        .logo { font-size: 80px; margin-bottom: 20px; display: block; }
        h1 { font-size: 42px; font-weight: 700; margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        p { font-size: 18px; opacity: 0.9; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 16px 32px; background: linear-gradient(90deg, #00d4ff, #7c3aed); color: white; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 16px; transition: transform 0.2s, box-shadow 0.2s; border: none; cursor: pointer; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <span class="logo">📚</span>
        <h1>Adaptive Revision</h1>
        <p>Powered by AI • AQA Exam Board</p>
        <a href="/frontend/login.html" class="btn">Sign In</a>
    </div>
</body>
</html>
